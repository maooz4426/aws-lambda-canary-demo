name: Deploy-v2

on:
  workflow_dispatch: 
  # pull_request: 
  #   types: [opened,reopened,synchronize]
  #   branches: 
  #      - main
env:
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_OIDC_ROLE_NAME: gha-oidc-lambda-canary-demo-role
  FUNCTION_NAME: canary_test_v2
  ECR_REPOSITORY: canary

concurrency: 
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write 
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: go mod vendor
        run: go mod vendor
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.AWS_OIDC_ROLE_NAME }}
          aws-region: ap-northeast-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set ECR URL
        run: echo "ECR_URL=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> $GITHUB_ENV
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./cmd/v2/Dockerfile
          push: true
          tags: ${{ env.ECR_URL }}:latest
          provenance: false
      - name: Update Functions
        run: |
          aws lambda update-function-code --function-name ${{ env.FUNCTION_NAME }} --image-uri ${{ env.ECR_URL }}:latest
      - name: Wait for update-function-code completion
        timeout-minutes: 10
        run: |
          aws lambda wait function-updated --function-name ${{ env.FUNCTION_NAME }}

